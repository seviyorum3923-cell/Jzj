name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unzip project
        run: unzip -q jarvis-proje.zip -d proj
      - name: Build
        run: gradle -p proj assembleDebug --no-daemon
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" proj/app/build/outputs/apk/debug/app-debug.apk --repo ${{ github.repository }} --title "Jarvis ${{ github.run_number }}" --notes "APK hazir"
